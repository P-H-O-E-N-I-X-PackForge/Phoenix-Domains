modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Omicron-Industries/PhoenixDomains/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
authors = "${mod_author}"
description = '''
Phoenix Domains - chunk claiming and land protection for guilds/teams and solo players. Requires
either Phoenix Guilds or FTB Teams for group ownership.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_wiki"
type = "required"
versionRange = "[0.5.8,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "phoenix_guilds"
type = "optional"
versionRange = "[0.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
