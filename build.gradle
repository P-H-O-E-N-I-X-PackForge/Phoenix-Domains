buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { //GTM maven
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'appeng'
            includeGroup 'lu.kolja'

        }
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // JourneyMap integration
        name = 'JourneyMap Maven'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content {
            includeGroup 'info.journeymap'
        }
    }
    maven { // Xaero's Minimap/World Map integration
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven/'
        content {
            includeGroupAndSubgroups 'xaero'
        }
    }
    flatDir {
        dir 'libs'
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        name = 'LatvianModder'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
jar {
    manifest.attributes([
            "MixinConfigs": "phoenix_domains.mixins.json"
    ])
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    jarJar(api("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")).version {
        require("[${mixinextras_version},)")
    }

    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    modImplementation 'curse.maven:phoenix-guilds-1612085:8743646'

    modCompileOnly 'curse.maven:phoenix-chronicles-quests-1614113:8751236'
    modRuntimeOnly 'curse.maven:phoenix-chronicles-quests-1614113:8751236'

    modCompileOnly'curse.maven:solaris-map-1622856:8747223'
    modRuntimeOnly'curse.maven:solaris-map-1622856:8747223'

    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }

    modCompileOnly("info.journeymap:journeymap-api:${journeymap_api_version}")
    modCompileOnly("curse.maven:journeymap-32274:${journeymap_curse_file}")

    modCompileOnly("xaero.lib:xaerolib-forge-${minecraft_version}:${xaeroslib_version}")
    modCompileOnly("xaero.map:xaeroworldmap-forge-${minecraft_version}:${xaerosworldmap_version}")
    modCompileOnly("xaero.minimap:xaerominimap-forge-${minecraft_version}:${xaerosminimap_version}")
  //  modRuntimeOnly("xaero.lib:xaerolib-forge-${minecraft_version}:${xaeroslib_version}")
  //  modRuntimeOnly("xaero.map:xaeroworldmap-forge-${minecraft_version}:${xaerosworldmap_version}")
    //modRuntimeOnly("xaero.minimap:xaerominimap-forge-${minecraft_version}:${xaerosminimap_version}")

    modRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }

    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")


    modImplementation("curse.maven:phoenixwiki-1647798:8735977")


    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {

        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}


tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true"
}
