buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { //GTM maven
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'appeng'
            includeGroup 'lu.kolja'

        }
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { // JourneyMap integration
        name = 'JourneyMap Maven'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content {
            includeGroup 'info.journeymap'
        }
    }
    maven { // Xaero's Minimap/World Map integration
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven/'
        content {
            includeGroupAndSubgroups 'xaero'
        }
    }
    flatDir {
        dir 'libs'
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
// need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // KubeJS — optional scripting integration only, see integration.kubejs. Mirrors the same
        // coordinates/version already verified working in Solaris and PhoenixChronicles.
        name = 'LatvianModder'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        gameTestServer {
            // RunModel has no gameTestServer() convenience method (only client()/clientData()/
            // data()/server()/serverData()) - the run type still exists in Forge's userdev
            // template though, so it's set directly via the underlying `type` property.
            type = 'gameTestServer'
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        data {
            data()
            sourceSet = sourceSets.main
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
jar {
    manifest.attributes([
            "MixinConfigs": "phoenix_domains.mixins.json"
    ])
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    jarJar(api("io.github.llamalad7:mixinextras-forge:${mixinextras_version}")).version {
        require("[${mixinextras_version},)")
    }

    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    modImplementation 'curse.maven:phoenix-guilds-1612085:8460956'

    modCompileOnly 'curse.maven:phoenix-chronicles-quests-1614113:8465025'

    modCompileOnly 'curse.maven:solaris-map-1622856:8499232'

    modRuntimeOnly 'curse.maven:phoenix-guilds-1612085:8460956'

    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }

    modRuntimeOnly 'curse.maven:phoenix-chronicles-quests-1614113:8465025'

    modRuntimeOnly 'curse.maven:solaris-map-1622856:8499232'

    
    modCompileOnly("info.journeymap:journeymap-api:${journeymap_api_version}")
    modCompileOnly("curse.maven:journeymap-32274:${journeymap_curse_file}")
   //modRuntimeOnly("curse.maven:journeymap-32274:${journeymap_curse_file}")

    modCompileOnly("xaero.lib:xaerolib-forge-${minecraft_version}:${xaeroslib_version}")
    modCompileOnly("xaero.map:xaeroworldmap-forge-${minecraft_version}:${xaerosworldmap_version}")
    modCompileOnly("xaero.minimap:xaerominimap-forge-${minecraft_version}:${xaerosminimap_version}")
  //  modRuntimeOnly("xaero.lib:xaerolib-forge-${minecraft_version}:${xaeroslib_version}")
  //  modRuntimeOnly("xaero.map:xaeroworldmap-forge-${minecraft_version}:${xaerosworldmap_version}")
    //modRuntimeOnly("xaero.minimap:xaerominimap-forge-${minecraft_version}:${xaerosminimap_version}")

    modRuntimeOnly("com.tterrag.registrate:Registrate:${registrate_version}")

    modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }

    // KubeJS — compile-time only: the plugin class (see integration.kubejs) is only ever
    // instantiated by KubeJS itself (via kubejs.plugins.txt), and only if KubeJS is actually
    // installed, so Domains works fine without it at runtime. Not added as modRuntimeOnly since
    // packs that DO run KubeJS already provide it themselves — bundling/requiring our own copy
    // would just be redundant and risks a version clash with whatever the pack ships.
    modCompileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")

    // Phoenix Wiki - jar-in-jar'd shared theme system (net.phoenixvine.wiki.theme.PhoenixTheme)
    // and markdown/wiki engine (net.phoenixvine.wiki.PhoenixWikiAPI) - the same theme choice this
    // library holds is shared with every other Phoenixvine mod that also embeds it. After changing
    // anything in that project, run `./gradlew publishToDomains` there to refresh libs/phoenix_wiki-*.jar.
    jarJar(modImplementation("local:phoenix_wiki:0.1.0"))


    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        // Pulls in the same Minecraft/Forge classpath main compiles against, so pure-logic
        // classes that merely reference simple data types (ChunkKey, CompoundTag, UUID) can be
        // unit tested without a running game or registry bootstrap - anything that actually
        // needs live registries/rendering stays untested.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}


tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}
