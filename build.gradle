plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = maven_group

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com/'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Devos Snapshot Maven'
        url = 'https://mvn.devos.one/snapshots/'
        content {
            includeGroup 'com.tterrag.registrate'
        }
    }
    maven {
        name = 'Repsy Toma Maven'
        url = 'https://repo.repsy.io/mvn/toma/public/'
        content {
            includeGroup 'dev.toma.configuration'
        }
    }
    maven {
        name = 'Architectury Maven'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'LatvianDev Maven'
        url = 'https://maven.latvian.dev/releases/'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.rtyley'
        }
    }
    maven {
        name = 'FTB Maven'
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com/'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Repsy'
        url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
    }
}

base {
    archivesName = archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Phoenix suite
    jarJar(implementation("net.phoenixvine.wiki:neoforge:${phoenix_wiki_version}")) {
        version { strictly "[${phoenix_wiki_version},)"; prefer phoenix_wiki_version }
    }
    compileOnly "net.phoenixvine.chronicles:phoenix_chronicles-neoforge:${chronicles_version}"
    compileOnly "net.phoenixvine.guilds:phoenix-guilds-neoforge:${phoenix_guilds_version}"
    compileOnly files("libs/solaris-neoforge-1.6.4.jar")

    // Optional integrations
    compileOnly "dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}"
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"

    // Dev runtime
    localRuntime "net.phoenixvine.chronicles:phoenix_chronicles-neoforge:${chronicles_version}"
    localRuntime("net.phoenixvine.guilds:phoenix-guilds-neoforge:${phoenix_guilds_version}") { transitive = false }
    localRuntime "dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            mod_url                : mod_url,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Repsy'
            url = uri('https://repo.repsy.io/mvn/user75142941/phoenixsuite')
            credentials {
                username = project.findProperty('repsyUsername') ?: System.getenv('REPSY_USERNAME')
                password = project.findProperty('repsyPassword') ?: System.getenv('REPSY_PASSWORD')
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
